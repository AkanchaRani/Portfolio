<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="sw-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sw-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#sw-bg)"/>
  
  <!-- Left Content -->
  <g transform="translate(80, 150)">
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="700" fill="#34d399">💰 SpendWise Finance</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="46" font-weight="800" fill="#ffffff" y="70">Master Your Personal</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="46" font-weight="800" fill="#ffffff" y="125">Finances &amp; Budgets</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#94a3b8" y="180">Interactive expense breakdown, category limits,</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#94a3b8" y="210">and real-time financial health analytics.</text>
    <rect x="0" y="260" width="220" height="54" rx="27" fill="url(#sw-btn)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff" x="110" y="294" text-anchor="middle">Start Tracking Free</text>
  </g>
  
  <!-- Right UI Preview Card -->
  <g transform="translate(620, 110)" filter="url(#sw-shadow)">
    <rect width="500" height="450" rx="24" fill="#0f172a" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2"/>
    <rect x="30" y="30" width="440" height="40" rx="10" fill="#1e293b"/>
    <circle cx="50" cy="50" r="6" fill="#ef4444"/>
    <circle cx="70" cy="50" r="6" fill="#f59e0b"/>
    <circle cx="90" cy="50" r="6" fill="#10b981"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#94a3b8" x="115" y="55">SpendWise Dashboard</text>
    
    <!-- Balance Card -->
    <rect x="30" y="90" width="210" height="100" rx="16" fill="#1e293b"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94a3b8" x="50" y="120">Monthly Budget</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="26" font-weight="800" fill="#10b981" x="50" y="155">$2,450.00</text>
    
    <!-- Savings Card -->
    <rect x="260" y="90" width="210" height="100" rx="16" fill="#1e293b"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94a3b8" x="280" y="120">Total Saved</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="26" font-weight="800" fill="#38bdf8" x="280" y="155">$860.00</text>
    
    <!-- Chart Preview -->
    <rect x="30" y="210" width="440" height="200" rx="16" fill="#1e293b"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#ffffff" x="50" y="240">Expense Breakdown</text>
    
    <!-- Progress Bars -->
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94a3b8" x="50" y="275">Housing &amp; Utilities (45%)</text>
    <rect x="50" y="285" width="400" height="8" rx="4" fill="#334155"/>
    <rect x="50" y="285" width="180" height="8" rx="4" fill="#10b981"/>
    
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94a3b8" x="50" y="325">Food &amp; Dining (25%)</text>
    <rect x="50" y="335" width="400" height="8" rx="4" fill="#334155"/>
    <rect x="50" y="335" width="100" height="8" rx="4" fill="#38bdf8"/>
    
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94a3b8" x="50" y="375">Subscriptions &amp; Tech (15%)</text>
    <rect x="50" y="385" width="400" height="8" rx="4" fill="#334155"/>
    <rect x="50" y="385" width="60" height="8" rx="4" fill="#a855f7"/>
  </g>
</svg>