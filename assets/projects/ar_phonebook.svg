<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="pb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="pb-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="pb-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#pb-bg)"/>
  
  <!-- Left Content -->
  <g transform="translate(80, 150)">
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="700" fill="#a5b4fc">📱 AR-PhoneBook Web</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="46" font-weight="800" fill="#ffffff" y="70">Modern &amp; Secure</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="46" font-weight="800" fill="#ffffff" y="125">Contact Directory</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#94a3b8" y="180">Node.js, Express &amp; MySQL full-stack CRUD</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#94a3b8" y="210">with instant live search and responsive UI.</text>
    <rect x="0" y="260" width="220" height="54" rx="27" fill="url(#pb-btn)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff" x="110" y="294" text-anchor="middle">Explore Contacts</text>
  </g>
  
  <!-- Right UI Preview Card -->
  <g transform="translate(620, 110)" filter="url(#pb-shadow)">
    <rect width="500" height="450" rx="24" fill="#0f172a" stroke="rgba(99, 102, 241, 0.35)" stroke-width="2"/>
    <rect x="30" y="30" width="440" height="44" rx="22" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#94a3b8" x="60" y="58">🔍 Search contacts by name, email or phone...</text>
    
    <!-- Contact Card 1 -->
    <rect x="30" y="95" width="440" height="75" rx="16" fill="#1e293b"/>
    <circle cx="70" cy="132" r="22" fill="#6366f1"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#ffffff" x="105" y="126">Akancha Rani</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94a3b8" x="105" y="146">+91 8292415174 • Software Engineer</text>
    <rect x="380" y="115" width="70" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#818cf8" x="415" y="135" text-anchor="middle">Call</text>
    
    <!-- Contact Card 2 -->
    <rect x="30" y="185" width="440" height="75" rx="16" fill="#1e293b"/>
    <circle cx="70" cy="222" r="22" fill="#a855f7"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#ffffff" x="105" y="216">Rahul Sharma</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94a3b8" x="105" y="236">rahul.dev@example.com • Backend Dev</text>
    <rect x="380" y="205" width="70" height="32" rx="16" fill="rgba(168, 85, 247, 0.2)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#c084fc" x="415" y="225" text-anchor="middle">Message</text>
    
    <!-- Contact Card 3 -->
    <rect x="30" y="275" width="440" height="75" rx="16" fill="#1e293b"/>
    <circle cx="70" cy="312" r="22" fill="#06b6d4"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700" fill="#ffffff" x="105" y="306">Priya Patel</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#94a3b8" x="105" y="326">priya@techcorp.com • Product Manager</text>
    <rect x="380" y="295" width="70" height="32" rx="16" fill="rgba(6, 182, 212, 0.2)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#22d3ee" x="415" y="315" text-anchor="middle">Call</text>
    
    <!-- Bottom Add Button -->
    <rect x="30" y="370" width="440" height="50" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#818cf8" x="250" y="401" text-anchor="middle">+ Add New Contact</text>
  </g>
</svg>