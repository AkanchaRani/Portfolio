<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="cr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cr-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cr-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#cr-bg)"/>
  
  <!-- Left Content -->
  <g transform="translate(80, 150)">
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">🚗 Car Rental System</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="46" font-weight="800" fill="#ffffff" y="70">Premium Vehicle</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="46" font-weight="800" fill="#ffffff" y="125">Fleet &amp; Bookings</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#94a3b8" y="180">C++ OOP architecture with vehicle tracking,</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#94a3b8" y="210">rental calculation, and file persistence.</text>
    <rect x="0" y="260" width="220" height="54" rx="27" fill="url(#cr-btn)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff" x="110" y="294" text-anchor="middle">Rent a Vehicle</text>
  </g>
  
  <!-- Right UI Preview Card -->
  <g transform="translate(620, 110)" filter="url(#cr-shadow)">
    <rect width="500" height="450" rx="24" fill="#0f172a" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#ffffff" x="35" y="60">Available Fleet</text>
    
    <!-- Vehicle 1 -->
    <rect x="30" y="85" width="440" height="100" rx="16" fill="#1e293b"/>
    <rect x="45" y="100" width="90" height="70" rx="12" fill="#334155"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="30" x="90" y="145" text-anchor="middle">🏎️</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="700" fill="#ffffff" x="150" y="125">Tesla Model 3 • Electric</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#38bdf8" x="150" y="148">$65 / day • Available Now</text>
    <rect x="360" y="115" width="95" height="38" rx="19" fill="#0284c7"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#ffffff" x="407" y="139" text-anchor="middle">Book</text>
    
    <!-- Vehicle 2 -->
    <rect x="30" y="200" width="440" height="100" rx="16" fill="#1e293b"/>
    <rect x="45" y="215" width="90" height="70" rx="12" fill="#334155"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="30" x="90" y="260" text-anchor="middle">🚙</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="700" fill="#ffffff" x="150" y="240">BMW X5 • Luxury SUV</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#38bdf8" x="150" y="263">$90 / day • Available Now</text>
    <rect x="360" y="230" width="95" height="38" rx="19" fill="#0284c7"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#ffffff" x="407" y="254" text-anchor="middle">Book</text>
    
    <!-- Vehicle 3 -->
    <rect x="30" y="315" width="440" height="100" rx="16" fill="#1e293b"/>
    <rect x="45" y="330" width="90" height="70" rx="12" fill="#334155"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="30" x="90" y="375" text-anchor="middle">🚗</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="700" fill="#ffffff" x="150" y="355">Audi A6 • Executive Sedan</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#38bdf8" x="150" y="378">$80 / day • Available Now</text>
    <rect x="360" y="345" width="95" height="38" rx="19" fill="#0284c7"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#ffffff" x="407" y="369" text-anchor="middle">Book</text>
  </g>
</svg>