<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="fo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="fo-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="fo-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#fo-bg)"/>
  
  <!-- Left Content -->
  <g transform="translate(80, 150)">
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="700" fill="#fbbf24">📁 Automated File Organizer</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="46" font-weight="800" fill="#ffffff" y="70">One-Click Smart</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="46" font-weight="800" fill="#ffffff" y="125">Directory Cleanups</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#94a3b8" y="180">Bash utility for sorting chaotic folders into clean,</text>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#94a3b8" y="210">categorized storage with ShellCheck CI/CD.</text>
    <rect x="0" y="260" width="220" height="54" rx="27" fill="url(#fo-btn)"/>
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff" x="110" y="294" text-anchor="middle">Run Script</text>
  </g>
  
  <!-- Right UI Preview Card -->
  <g transform="translate(620, 110)" filter="url(#fo-shadow)">
    <rect width="500" height="450" rx="24" fill="#09090b" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2"/>
    <rect x="30" y="30" width="440" height="40" rx="10" fill="#18181b"/>
    <circle cx="50" cy="50" r="6" fill="#ef4444"/>
    <circle cx="70" cy="50" r="6" fill="#f59e0b"/>
    <circle cx="90" cy="50" r="6" fill="#10b981"/>
    <text font-family="DM Mono, monospace" font-size="14" fill="#fbbf24" x="110" y="55">bash organize.sh --target ~/Downloads</text>
    
    <!-- Terminal Output -->
    <rect x="30" y="90" width="440" height="325" rx="16" fill="#18181b"/>
    <text font-family="DM Mono, monospace" font-size="13" fill="#10b981" x="50" y="125">[+] Initializing scan in target directory...</text>
    <text font-family="DM Mono, monospace" font-size="13" fill="#94a3b8" x="50" y="155">[✓] Found 248 uncategorized files</text>
    
    <text font-family="DM Mono, monospace" font-size="13" fill="#38bdf8" x="50" y="195">→ Categorized 84 Images to /Images</text>
    <text font-family="DM Mono, monospace" font-size="13" fill="#38bdf8" x="50" y="225">→ Categorized 42 Documents to /Documents</text>
    <text font-family="DM Mono, monospace" font-size="13" fill="#38bdf8" x="50" y="255">→ Categorized 18 Code files to /SourceCode</text>
    <text font-family="DM Mono, monospace" font-size="13" fill="#38bdf8" x="50" y="285">→ Categorized 12 Archives to /Compressed</text>
    
    <rect x="50" y="315" width="400" height="42" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)"/>
    <text font-family="DM Mono, monospace" font-size="13" font-weight="700" fill="#34d399" x="250" y="341" text-anchor="middle">✨ Cleanup Complete in 0.42s (100% Success)</text>
    
    <text font-family="DM Mono, monospace" font-size="12" fill="#64748b" x="50" y="390">ShellCheck CI/CD: Passed (0 warnings)</text>
  </g>
</svg>